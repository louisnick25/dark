<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>展示端｜Windows 一體機</title>
  <script src="assets/data.js"></script>
  <style>
    :root {
      --bg: #111317;
      --panel: #1f2126;
      --line: #a98a67;
      --accent: #f0b279;
      --red: #c24b3f;
      --text: #f1f1f1;
      --muted: #a7a7aa;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      padding: 24px 36px;
      display: none;
      overflow: hidden;
    }

    .map-stage {
      display: flex;
      flex-direction: column;
      height: 100%;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }

    .map-graphic {
      width: min(68vw, 1050px);
      height: min(62vh, 760px);
      border-radius: 28px;
      background-color: #1b1d22;
      background-image: url('assets/map_base.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      border: 2px solid #2a2c30;
      box-shadow: inset 0 0 60px #00000055;
    }

    .special-districts {
      width: min(78vw, 1220px);
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }

    .pill {
      border: 4px solid var(--line);
      border-radius: 999px;
      padding: 16px 42px;
      font-size: clamp(28px, 2vw, 44px);
      background: #272a31;
    }

    #district-view {
      display: none;
      overflow: hidden;
    }

    .section-head {
      text-align: center;
      margin-bottom: 18px;
      min-height: 150px;
    }

    .section-title {
      margin: 0;
      font-size: clamp(56px, 6vw, 110px);
      color: var(--accent);
      letter-spacing: 2px;
      font-weight: 900;
    }

    .section-subtitle {
      margin: 10px 0 0;
      font-size: clamp(34px, 3vw, 64px);
      color: var(--muted);
    }

    .member-grid {
      --avatar-size: 180px;
      --name-size: 52px;
      width: min(1320px, 90vw);
      margin: 0 auto;
      height: calc(100vh - 240px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 1fr;
      gap: 20px;
    }

    .member-card {
      background: var(--panel);
      border: 1px solid #7a6a53;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }

    .member-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      border: 6px solid var(--accent);
      object-fit: cover;
      background: #dedede;
      flex-shrink: 0;
    }

    .member-name {
      font-size: var(--name-size);
      line-height: 1.1;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .intro-title {
      color: var(--red);
      margin-bottom: 22px;
    }

    .intro-wrap {
      width: min(1460px, 92vw);
      margin: 0 auto;
      display: grid;
      gap: 16px;
      grid-template-rows: 1fr auto;
      height: calc(100vh - 210px);
    }

    .intro-top {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      min-height: 0;
    }

    .profile-card,
    .media-box,
    .bio-box {
      border: 1px solid #7a6a53;
      border-radius: 10px;
      background: var(--panel);
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 18px;
    }


    .intro-avatar {
      width: clamp(180px, 16vw, 260px);
      height: clamp(180px, 16vw, 260px);
      border-radius: 50%;
      border: 6px solid var(--accent);
      object-fit: cover;
      background: #dedede;
      flex-shrink: 0;
    }

    .intro-name {
      font-size: clamp(44px, 2.8vw, 68px);
      line-height: 1.1;
      text-align: center;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .media-box {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #757575;
      font-size: 34px;
      background: #24262b;
    }

    .media-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #101010;
    }

    .bio-box {
      padding: 28px 30px;
      font-size: clamp(38px, 2.6vw, 52px);
      line-height: 1.35;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <section id="home-view" class="screen">
    <div class="map-stage">
      <div class="map-graphic" aria-label="台南市選區地圖"></div>
      <div id="special-districts" class="special-districts"></div>
    </div>
  </section>

  <section id="district-view" class="screen">
    <header class="section-head">
      <h1 id="district-title" class="section-title"></h1>
      <p id="district-subtitle" class="section-subtitle"></p>
    </header>
    <div id="district-grid" class="member-grid"></div>
  </section>

  <section id="intro-view" class="screen">
    <header class="section-head">
      <h1 class="section-title intro-title">個人介紹</h1>
    </header>
    <div class="intro-wrap">
      <div class="intro-top">
        <article class="profile-card">
          <img id="intro-photo" class="intro-avatar" alt="議員照片" />
          <div id="intro-name" class="intro-name"></div>
        </article>
        <div class="media-box">
          <video id="intro-video" controls autoplay muted playsinline></video>
        </div>
      </div>
      <div id="intro-bio" class="bio-box"></div>
    </div>
  </section>

  <script>
    const bc = new BroadcastChannel('tainan_map_sync');
    const fallbackPhoto = 'assets/photos/default.jpg';
    const historyStack = [];
    let currentState = { type: 'home' };

    function showScreen(id) {
      ['home-view', 'district-view', 'intro-view'].forEach((viewId) => {
        document.getElementById(viewId).style.display = viewId === id ? 'block' : 'none';
      });
    }

    function tuneDistrictGrid(memberCount) {
      const grid = document.getElementById('district-grid');
      const rows = Math.max(1, Math.ceil(memberCount / 3));
      const top = grid.getBoundingClientRect().top;
      const availableHeight = Math.max(240, window.innerHeight - top - 28);
      const gap = 20;
      const cardHeight = Math.max(120, (availableHeight - gap * (rows - 1)) / rows);

      const avatarSize = Math.max(90, Math.min(190, cardHeight * 0.56));
      const nameSize = Math.max(22, Math.min(58, cardHeight * 0.23));

      grid.style.height = `${availableHeight}px`;
      grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
      grid.style.setProperty('--avatar-size', `${avatarSize}px`);
      grid.style.setProperty('--name-size', `${nameSize}px`);
    }

    function setState(nextState, shouldPush = true) {
      if (shouldPush && currentState?.type) {
        historyStack.push({ ...currentState });
      }
      currentState = { ...nextState };
    }

    function renderHome(shouldPush = true) {
      setState({ type: 'home' }, shouldPush);
      showScreen('home-view');
      const specialWrap = document.getElementById('special-districts');
      const specialDistricts = districts.filter((d) => d.id === 12 || d.id === 13);
      specialWrap.innerHTML = specialDistricts
        .map((d) => `<div class="pill">${d.name}(${d.areas})</div>`)
        .join('');
    }

    function renderDistrict(districtId, shouldPush = true) {
      const district = districts.find((d) => d.id === districtId);
      if (!district) return;

      setState({ type: 'district', districtId }, shouldPush);
      showScreen('district-view');
      document.getElementById('district-title').textContent = district.name;
      document.getElementById('district-subtitle').textContent = district.areas;

      const list = members.filter((m) => m.distId === districtId);
      const grid = document.getElementById('district-grid');
      grid.innerHTML = '';
      list.forEach((m) => {
        const card = document.createElement('article');
        card.className = 'member-card';

        const photo = document.createElement('img');
        photo.className = 'member-avatar';
        photo.alt = m.name;
        photo.src = `assets/photos/${m.id}.jpg`;
        photo.onerror = () => {
          photo.src = fallbackPhoto;
        };

        const name = document.createElement('div');
        name.className = 'member-name';
        name.textContent = m.name;

        card.appendChild(photo);
        card.appendChild(name);
        grid.appendChild(card);
      });

      requestAnimationFrame(() => tuneDistrictGrid(list.length));
    }

    function renderMember(memberId, shouldPush = true) {
      const member = members.find((m) => m.id === memberId);
      if (!member) return;

      setState({ type: 'member', memberId }, shouldPush);
      showScreen('intro-view');
      document.getElementById('intro-name').textContent = member.name;
      document.getElementById('intro-bio').textContent = member.bio;

      const photo = document.getElementById('intro-photo');
      photo.src = `assets/photos/${member.id}.jpg`;
      photo.onerror = () => { photo.src = fallbackPhoto; };

      const video = document.getElementById('intro-video');
      video.src = `assets/videos/${member.id}.mp4`;
      video.onerror = () => {
        video.removeAttribute('src');
        video.load();
      };
      video.onloadeddata = () => video.play().catch(() => {});
    }

    function goBack() {
      const previous = historyStack.pop();
      if (!previous) return;
      if (previous.type === 'home') renderHome(false);
      if (previous.type === 'district') renderDistrict(previous.districtId, false);
      if (previous.type === 'member') renderMember(previous.memberId, false);
    }

    bc.onmessage = ({ data }) => {
      if (data.type === 'SHOW_HOME' || data.type === 'RESET') {
        historyStack.length = 0;
        renderHome(false);
      }
      if (data.type === 'CHANGE_DISTRICT') renderDistrict(data.districtId);
      if (data.type === 'SHOW_MEMBER') renderMember(data.memberId);
      if (data.type === 'BACK') goBack();
    };

    window.addEventListener('resize', () => {
      if (currentState.type === 'district') {
        const count = members.filter((m) => m.distId === currentState.districtId).length;
        tuneDistrictGrid(count);
      }
    });

    renderHome(false);
  </script>
</body>
</html>
